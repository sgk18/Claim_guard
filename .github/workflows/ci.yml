name: ClaimGuard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-verification:
    name: Test, Build & Container Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 1. Root & Web Frontend Quality Suite
      - name: Install Root Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Validate TypeScript Compilation (Frontend)
        run: npx tsc --noEmit

      - name: Execute Full Test Suite (Deterministic Engine, API & CSAD QA)
        run: npm test

      - name: Build Next.js Production Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # 2. Standalone Fastify Server Quality Suite
      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Compile Standalone Server (TypeScript)
        run: npm --prefix server run build

      - name: Run Standalone Server Integration Tests
        run: npm --prefix server test

      # 3. Production Container Verification
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Container Image (Verification)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: claimguard-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
