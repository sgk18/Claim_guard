<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F97316" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="#090D16" />
  <rect width="1200" height="680" fill="url(#archGrid)" />

  <!-- Diagram Title Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">
      ClaimGuard End-to-End System Architecture
    </text>
    <text x="0" y="24" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      Decoupled microservice topology, deterministic verification pipeline, cloud persistence, and multi-tenant security
    </text>
  </g>

  <!-- TIER 1: CLIENT INGESTION (Top) -->
  <g transform="translate(50, 85)">
    <rect width="1100" height="95" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <rect width="1100" height="24" rx="8" fill="#1E293B" />
    <rect width="1100" height="4" y="20" fill="#1E293B" />
    <text x="15" y="16" fill="#FDBA74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIER 1: MULTI-CHANNEL CLIENT INGESTION</text>

    <!-- Client Box 1: Employee Mobile WebView -->
    <g transform="translate(25, 34)">
      <rect width="320" height="50" rx="6" fill="#0F172A" stroke="#F97316" stroke-width="1" />
      <text x="15" y="22" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Employee Mobile WebView (/employee)</text>
      <text x="15" y="40" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">WhatsApp-like UI • Instant OCR • Inline Correction</text>
    </g>

    <!-- Client Box 2: Flutter Cross-Platform Client -->
    <g transform="translate(385, 34)">
      <rect width="320" height="50" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
      <text x="15" y="22" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Flutter Mobile Client (apps/mobile)</text>
      <text x="15" y="40" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Android APK &amp; Web • Camera Preview • Offline Cache</text>
    </g>

    <!-- Client Box 3: Finance Operations Cockpit -->
    <g transform="translate(745, 34)">
      <rect width="330" height="50" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1" />
      <text x="15" y="22" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Finance Operations Cockpit (/manager)</text>
      <text x="15" y="40" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Split-Screen Audit • Duplicate Proofs • CSV Reports</text>
    </g>
  </g>

  <!-- Connectors from Tier 1 to Tier 2 -->
  <path d="M 235 180 L 235 210 L 600 210 L 600 220" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 545 180 L 545 220" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowBlue)" />
  <path d="M 910 180 L 910 210 L 600 210" fill="none" stroke="#34D399" stroke-width="1.5" />

  <!-- TIER 2: NGINX GATEWAY & REVERSE PROXY -->
  <g transform="translate(250, 225)">
    <rect width="700" height="55" rx="8" fill="#131D31" stroke="#38BDF8" stroke-width="1.5" />
    <text x="350" y="24" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">
      NGINX REVERSE PROXY &amp; API GATEWAY (:80 / :443)
    </text>
    <text x="350" y="44" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11.5" text-anchor="middle">
      Gzip Compression • 25MB Body Limits • SSL Termination • Route /api/v1/* to Fastify &amp; /* to Next.js
    </text>
  </g>

  <!-- Connector split from NGINX to Tier 3 -->
  <path d="M 400 280 L 400 315 L 300 315 L 300 330" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 800 280 L 800 315 L 900 315 L 900 330" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- TIER 3: APPLICATION SERVICES (Fastify + Next.js) -->
  <g transform="translate(50, 335)">
    <!-- Subsystem A: Fastify Microservice -->
    <g transform="translate(0, 0)">
      <rect width="520" height="120" rx="8" fill="url(#cardGrad)" stroke="#F97316" stroke-width="1.2" />
      <rect width="520" height="24" rx="8" fill="#1E293B" />
      <rect width="520" height="4" y="20" fill="#1E293B" />
      <text x="15" y="16" fill="#FDBA74" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">STANDALONE FASTIFY BACKEND (:3001)</text>
      
      <text x="15" y="48" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">Sub-10ms REST API &amp; Pluggable Engine</text>
      <text x="15" y="68" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• StorageProvider: AWS S3 / Local Disk / In-Memory Mock</text>
      <text x="15" y="86" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• OCRProvider: AWS Textract / Bedrock Vision / Fallback Mock</text>
      <text x="15" y="104" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• MessagingProvider: WhatsApp Business API / Webhooks</text>
    </g>

    <!-- Subsystem B: Next.js 15 Web Application -->
    <g transform="translate(580, 0)">
      <rect width="520" height="120" rx="8" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.2" />
      <rect width="520" height="24" rx="8" fill="#1E293B" />
      <rect width="520" height="4" y="20" fill="#1E293B" />
      <text x="15" y="16" fill="#7DD3FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">NEXT.JS 15 APP ROUTER APPLICATION (:3000)</text>
      
      <text x="15" y="48" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12.5" font-weight="600">React 19 Server Components &amp; Operational Dashboards</text>
      <text x="15" y="68" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• In-Process Verification Rules &amp; Perceptual Image Hashing</text>
      <text x="15" y="86" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• High-Resolution Zoom Viewer with Raw OCR Bounding Overlays</text>
      <text x="15" y="104" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">• Executive Analytics, CSV ITC Reports &amp; Join-Code Pairing</text>
    </g>
  </g>

  <!-- Connectors from Tier 3 to Tier 4 & 5 -->
  <path d="M 260 455 L 260 485 L 600 485 L 600 500" fill="none" stroke="#F97316" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 840 455 L 840 485 L 600 485" fill="none" stroke="#38BDF8" stroke-width="1.5" />

  <!-- TIER 4: DETERMINISTIC VERIFICATION & FRAUD ENGINE -->
  <g transform="translate(50, 505)">
    <rect width="1100" height="75" rx="8" fill="#131D31" stroke="#F97316" stroke-width="1.5" />
    <rect width="1100" height="22" rx="8" fill="#1E293B" />
    <rect width="1100" height="4" y="18" fill="#1E293B" />
    <text x="15" y="15" fill="#FDBA74" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">DETERMINISTIC FRAUD DETECTION &amp; EVIDENCE ENGINE</text>

    <g transform="translate(15, 30)">
      <rect width="150" height="34" rx="4" fill="#0F172A" stroke="#334155" />
      <text x="75" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Perceptual dHash</text>
      <text x="75" y="28" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Hamming ≤ 5 (+40)</text>
    </g>
    <g transform="translate(175, 30)">
      <rect width="155" height="34" rx="4" fill="#0F172A" stroke="#334155" />
      <text x="77" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">GSTIN Checksum</text>
      <text x="77" y="28" fill="#F97316" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Luhn Mod-36 (+25)</text>
    </g>
    <g transform="translate(340, 30)">
      <rect width="155" height="34" rx="4" fill="#0F172A" stroke="#334155" />
      <text x="77" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Amount Anomaly</text>
      <text x="77" y="28" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">&gt; 2.0x Mean (+20)</text>
    </g>
    <g transform="translate(505, 30)">
      <rect width="155" height="34" rx="4" fill="#0F172A" stroke="#334155" />
      <text x="77" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Category Mismatch</text>
      <text x="77" y="28" fill="#FBBF24" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Taxonomy (+20)</text>
    </g>
    <g transform="translate(670, 30)">
      <rect width="155" height="34" rx="4" fill="#0F172A" stroke="#334155" />
      <text x="77" y="16" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Policy Caps</text>
      <text x="77" y="28" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Daily Ceilings (+15)</text>
    </g>
    <g transform="translate(835, 30)">
      <rect width="250" height="34" rx="4" fill="#14532D" stroke="#22C55E" />
      <text x="125" y="16" fill="#86EFAC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">QUALIFIED AUTHENTICITY SCORE</text>
      <text x="125" y="28" fill="#DCFCE7" font-family="-apple-system, sans-serif" font-size="9.5" text-anchor="middle">VERIFIED • LIKELY_VALID • REVIEW • SUSPICIOUS</text>
    </g>
  </g>

  <!-- Connectors from Tier 4 to Tier 5 -->
  <path d="M 350 580 L 350 600" fill="none" stroke="#F97316" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 850 580 L 850 600" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#arrowBlue)" />

  <!-- TIER 5: PERSISTENCE & CLOUD BACKBONE (Bottom) -->
  <g transform="translate(50, 605)">
    <!-- DB Box -->
    <g transform="translate(0, 0)">
      <rect width="520" height="55" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="1.2" />
      <text x="20" y="24" fill="#34D399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">SUPABASE POSTGRESQL (11 Relational Tables)</text>
      <text x="20" y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Row-Level Security (RLS) • Immutable Audit Ledger • Perceptual Hash Indexing</text>
    </g>

    <!-- Cloud Box -->
    <g transform="translate(580, 0)">
      <rect width="520" height="55" rx="6" fill="#0F172A" stroke="#FB923C" stroke-width="1.2" />
      <text x="20" y="24" fill="#FB923C" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">AWS CLOUD BACKBONE (ap-southeast-2)</text>
      <text x="20" y="42" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">EC2 Amazon Linux 2023 • S3 KMS AES-256 Receipts • AWS SSM Zero-Port Admin</text>
    </g>
  </g>
</svg>
