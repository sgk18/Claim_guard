<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="180" cy="190" r="140" fill="#F97316" opacity="0.12" filter="url(#glow)" />
  <circle cx="1020" cy="120" r="160" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentOrange)" />

  <!-- Left Icon Mark: Geometric Shield + Verification Radar -->
  <g transform="translate(80, 95)">
    <!-- Outer Shield Frame -->
    <path d="M 60 10 L 115 35 V 95 C 115 140 60 175 60 175 C 60 175 5 140 5 95 V 35 Z" 
          fill="none" stroke="url(#accentOrange)" stroke-width="3.5" />
    <!-- Inner Shield Shading -->
    <path d="M 60 20 L 105 42 V 95 C 105 132 60 162 60 162 C 60 162 15 132 15 95 V 42 Z" 
          fill="url(#shieldGrad)" fill-opacity="0.15" />
    <!-- Radar Scan Arcs -->
    <path d="M 32 75 A 35 35 0 0 1 88 75" fill="none" stroke="#FDBA74" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M 22 62 A 50 50 0 0 1 98 62" fill="none" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <!-- Checkmark & Pulse Core -->
    <circle cx="60" cy="98" r="22" fill="#0F172A" stroke="#F97316" stroke-width="2.5" />
    <path d="M 50 98 L 57 105 L 72 88" fill="none" stroke="#FDBA74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Brand Typography & Titles -->
  <g transform="translate(235, 125)">
    <!-- Category Pill -->
    <g transform="translate(0, -32)">
      <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#F97316" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="12" cy="13" r="4.5" fill="#F97316" />
      <text x="24" y="17" fill="#FDBA74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">INDIA-FIRST FINTECH VERIFICATION</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
      Claim<tspan fill="url(#accentOrange)">Guard</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="68" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500">
      Real-Time Expense Verification &amp; Deterministic Fraud Prevention Platform
    </text>
    <text x="0" y="94" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400">
      Engineered for Indian distributed field workforces, logistics fleets, and Tier-2/Tier-3 sales networks.
    </text>

    <!-- Tech Badges Array -->
    <g transform="translate(0, 130)">
      <!-- Badge: Next.js 15 -->
      <g transform="translate(0, 0)">
        <rect width="98" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="49" y="17" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Next.js 15.5</text>
      </g>
      <!-- Badge: Fastify 4.28 -->
      <g transform="translate(108, 0)">
        <rect width="96" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="48" y="17" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fastify 4.28</text>
      </g>
      <!-- Badge: Flutter 3.x -->
      <g transform="translate(214, 0)">
        <rect width="90" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="45" y="17" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Flutter 3.x</text>
      </g>
      <!-- Badge: Supabase Postgres -->
      <g transform="translate(314, 0)">
        <rect width="134" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="67" y="17" fill="#34D399" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Supabase PG 15</text>
      </g>
      <!-- Badge: AWS ap-southeast-2 -->
      <g transform="translate(458, 0)">
        <rect width="146" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="73" y="17" fill="#FB923C" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AWS Cloud Backbone</text>
      </g>
      <!-- Badge: Claude 3.5 Sonnet -->
      <g transform="translate(614, 0)">
        <rect width="168" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="84" y="17" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Claude 3.5 on Bedrock</text>
      </g>
      <!-- Badge: 28/28 Tests -->
      <g transform="translate(792, 0)">
        <rect width="118" height="26" rx="6" fill="#14532D" stroke="#22C55E" stroke-width="1" />
        <text x="59" y="17" fill="#86EFAC" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">28/28 TESTS PASS</text>
      </g>
    </g>
  </g>

  <!-- Right Side Strategic Metric Callout -->
  <g transform="translate(1015, 80)">
    <rect width="145" height="180" rx="10" fill="#131D31" stroke="#334155" stroke-width="1.2" />
    <text x="72" y="32" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle" letter-spacing="1">DETERMINISTIC</text>
    <text x="72" y="66" fill="#F97316" font-family="-apple-system, sans-serif" font-size="28" font-weight="800" text-anchor="middle">100%</text>
    <text x="72" y="82" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Audit Integrity</text>
    
    <line x1="20" y1="96" x2="125" y2="96" stroke="#334155" stroke-width="1" />
    
    <text x="72" y="118" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">SUBMISSION TIME</text>
    <text x="72" y="146" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle">&lt; 30s</text>
    <text x="72" y="162" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="10" font-weight="400" text-anchor="middle">Zero App Install</text>
  </g>
</svg>
