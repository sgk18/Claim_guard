name: ClaimGuard CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 1. Root & Frontend Quality Checks
      - name: Install Root Dependencies
        run: npm ci

      - name: Run Deterministic Engine Tests
        run: node tests/claimguard.test.mjs

      - name: Build Next.js Production Frontend
        run: npm run build

      # 2. Standalone Server Quality Checks
      - name: Install Server Dependencies
        run: npm --prefix server ci

      - name: Compile Standalone Server (TypeScript)
        run: npm --prefix server run build

      - name: Run Standalone Server Integration Tests
        run: npm --prefix server test

      # 3. Container Verification
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: claimguard-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
